# Release on a version tag (v0.2.1, v0.3.0-rc.1, ...):
#   1. ci       every CI check (ci.yml)
#   2. verify   the tag names the workspace version, CHANGELOG.md has its
#               section, and the crates package (cargo publish --dry-run)
#   3. publish  cargo publish to crates.io, only after a reviewer approves the
#               "crates-io" environment
#   4. release  the GitHub Release, with that version's CHANGELOG section as notes
#               (a tag with a "-", such as v0.3.0-rc.1, makes a pre-release)
#
# A crates.io publish is permanent: a version can never be overwritten or
# deleted, only yanked. So the publish job waits for a person. Set this up once
# under Settings > Environments > crates-io:
#   - Required reviewers: yourself (leave "Prevent self-review" off);
#   - Deployment branches and tags: tags matching "v*" only;
#   - the CARGO_REGISTRY_TOKEN secret, kept here and not as a repository
#     secret, so no other job can read it.
# If the environment is missing, GitHub creates it with no reviewers, and a
# tag push would publish without asking. Check the settings before the first tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; never cancel one halfway through a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tag names the workspace version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "rexi-core") | .version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" \
              '$0 ~ "^## " v "( |$)" { f = 1; next } /^## / && f { exit } f' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
              echo "::error::CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section"
              exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
      - name: The crates package (dry run, nothing is uploaded)
        run: cargo publish --dry-run --workspace --locked

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/rexi-core/${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
              echo "::error::CARGO_REGISTRY_TOKEN is not set in the crates-io environment"
              exit 1
          fi
          cargo publish --workspace --locked

  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "rexi $VERSION" --notes-file notes.md "${flags[@]}"
