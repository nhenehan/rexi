[package]
name = "rexi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rexi-core"
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Dependency-free EXI (Efficient XML Interchange) codec core: bit I/O, datatypes, string tables, grammar runtime"

[package.metadata.docs.rs]
# Show the `trace` items too, marked as needing the feature.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
# std::io interoperability: blanket ByteSource/ByteSink impls for std::io::Read/Write.
std = []
trace = []
# Wildcards with declared names in strict mode: SE(*), SE(uri:*), AT(*), AT(uri:*)
# (EXI 8.5.4.1.6). Off by default; without it those productions are refused.
wildcard = []

[dependencies]

[lints]
workspace = true
