[package]
name = "rexi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Dependency-free EXI (Efficient XML Interchange) codec core: bit I/O, datatypes, string tables, grammar runtime"

[package.metadata.docs.rs]
# Show the `trace` items too, marked as needing the feature.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
# std::io interoperability: blanket ByteSource/ByteSink impls for std::io::Read/Write.
std = []
trace = []

[dependencies]

[lints]
workspace = true
