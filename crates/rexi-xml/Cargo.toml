[package]
name = "rexi-xml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rexi-xml"
keywords = ["exi", "xml", "binary", "encoding", "cli"]
categories = ["encoding", "parser-implementations", "command-line-utilities"]
readme = "../../README.md"
description = "XML <-> EXI event front-end and the rexi command line tool"

[[bin]]
name = "rexi"
path = "src/bin/rexi.rs"

[features]
# Wildcards with declared names in strict mode (EXI 8.5.4.1.6); see rexi-core.
wildcard = ["rexi-core/wildcard"]
# Preserve.lexicalValues (EXI 6.3): values kept as their exact text; see rexi-core.
lexical-values = ["rexi-core/lexical-values"]

[dependencies]
rexi-core = { workspace = true, features = ["std"] }
rexi-schema.workspace = true
quick-xml.workspace = true

[lints]
workspace = true
