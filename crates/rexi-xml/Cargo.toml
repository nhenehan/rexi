[package]
name = "rexi-xml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["exi", "xml", "binary", "encoding", "cli"]
categories = ["encoding", "parser-implementations", "command-line-utilities"]
readme = "../../README.md"
description = "XML <-> EXI event front-end and the rexi command line tool"

[[bin]]
name = "rexi"
path = "src/bin/rexi.rs"

[dependencies]
rexi-core = { workspace = true, features = ["std"] }
rexi-schema.workspace = true
quick-xml.workspace = true

[lints]
workspace = true
