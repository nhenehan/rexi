language = "C"
include_guard = "REXI_H"
pragma_once = false
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
usize_is_size_t = true
header = "/* rexi: C API for the strict schema-informed EXI codec (crates/rexi-capi). */"
autogen_warning = "/* WARNING: generated by cbindgen from crates/rexi-capi/src. Do not edit by hand. */"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[export]
prefix = ""

[enum]
prefix_with_name = false
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = false
